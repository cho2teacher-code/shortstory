<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>단편소설 읽기 (epub)</title>
<style>
@font-face {
  font-family: 'BookkMyungjo';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Lt.woff2') format('woff2');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'BookkMyungjo';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Bd.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --rdbg:#ffffff;--rdtx:#1a1a1a;--rdsep:rgba(0,0,0,.12);
  --bg:#f5f0e8;--sur:#faf7f2;--tx:#2a2118;--tx2:#7a6e62;--tx3:#a89e94;
  --acc:#5c4a32;--bdr:rgba(92,74,50,0.15);--tag:rgba(92,74,50,0.08);
  --serif:"Noto Serif KR",serif;--sans:"Noto Sans KR",sans-serif;
}
.dark{--rdbg:#1a1612;--rdtx:#e8e0d4;--rdsep:rgba(232,224,212,.15);--bg:#1a1612;--sur:#221e19;--tx:#e8e0d4;--tx2:#9a8e82;--tx3:#6a5e54;
  --bdr:rgba(232,224,212,0.1);--tag:rgba(232,224,212,0.07);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--sans);}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;}
.screen.off{display:none;}

#scr-login{background:var(--bg);align-items:center;justify-content:center;}
.lbox{background:var(--sur);border:1px solid var(--bdr);border-radius:20px;padding:36px 32px;width:300px;display:flex;flex-direction:column;gap:18px;}
.lbox h2{font-family:var(--serif);font-size:20px;text-align:center;}
.lbox p{font-size:13px;color:var(--tx2);text-align:center;line-height:1.6;margin-top:-8px;}
.lg{display:flex;flex-direction:column;gap:5px;}
.lg label{font-size:12px;color:var(--tx2);font-weight:500;}
.lg input{padding:11px 13px;border:1px solid var(--bdr);border-radius:9px;background:var(--bg);color:var(--tx);font-size:15px;font-family:var(--sans);outline:none;}
.lg input:focus{border-color:var(--acc);}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
.lbtn{padding:13px;background:var(--acc);color:#fff;border:none;border-radius:9px;font-size:15px;font-family:var(--sans);font-weight:500;cursor:pointer;}
.lnote{font-size:11px;color:var(--tx3);text-align:center;}

#scr-list{background:var(--bg);}
.lhdr{padding:18px 18px 12px;border-bottom:1px solid var(--bdr);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.lhdr h1{font-family:var(--serif);font-size:19px;letter-spacing:-.02em;}
.lhdr p{font-size:12px;color:var(--tx2);margin-top:3px;}
.hright{display:flex;gap:7px;align-items:center;}
.ubadge{font-size:12px;color:var(--tx2);background:var(--tag);padding:5px 10px;border-radius:99px;border:1px solid var(--bdr);}
.tbtn{width:33px;height:33px;border-radius:50%;border:1px solid var(--bdr);background:var(--sur);color:var(--tx2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lscroll{flex:1;overflow-y:auto;padding:14px 14px 36px;-webkit-overflow-scrolling:touch;}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:960px;margin:0 auto;}
.ncard{background:var(--sur);border:1px solid var(--bdr);border-radius:11px;padding:11px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;user-select:none;transition:transform .12s;}
.ncard:active{transform:scale(.97);}
.ncov{width:58px;flex-shrink:0;aspect-ratio:3/4;object-fit:cover;border-radius:4px;background:var(--tag);display:block;}
.ncov-fb{width:58px;flex-shrink:0;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--tag);border-radius:4px;padding:5px;gap:3px;}
.ncov-fb span{font-size:10px;color:var(--tx);text-align:center;line-height:1.3;font-family:var(--serif);font-weight:600;}
.ncov-fb small{font-size:9px;color:var(--tx2);}
.nbody{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;}
.nnum{font-size:10px;color:var(--tx3);letter-spacing:.04em;}
.ntitle{font-family:var(--serif);font-size:13px;font-weight:600;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.nauthor{font-size:11px;color:var(--tx2);}
.ntags{display:flex;flex-wrap:wrap;gap:3px;}
.ntag{font-size:10px;color:var(--acc);background:var(--tag);padding:2px 6px;border-radius:99px;}
.noneliner{font-size:11px;color:var(--tx2);line-height:1.5;font-style:italic;border-top:1px solid var(--bdr);padding-top:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

#scr-reader{transition:background .3s;}
.rtop{height:50px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);flex-shrink:0;gap:8px;z-index:10;}
.backbtn{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--acc);cursor:pointer;padding:8px 4px;white-space:nowrap;user-select:none;}
.rtitle{font-family:var(--serif);font-size:13px;opacity:.6;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rctrls{display:flex;gap:3px;flex-shrink:0;}
.cbtn{width:31px;height:31px;border-radius:7px;border:1px solid var(--bdr);background:transparent;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cbtn.on{background:var(--acc);color:#fff;border-color:var(--acc);}

.parea{flex:1;overflow:hidden;position:relative;}
.intro{position:absolute;inset:0;z-index:20;overflow-y:auto;padding:28px 28px 40px;display:flex;flex-direction:column;gap:13px;}
.intro.off{display:none;}
.icwrap{display:flex;justify-content:center;}
.icov{width:110px;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.18);}
.ititle{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.3;}
.iauthor{font-size:13px;color:var(--tx2);margin-top:-5px;}
.idesc{font-size:14px;line-height:1.8;opacity:.85;}
.ioneliner{font-size:13px;color:var(--tx2);font-style:italic;border-left:2px solid var(--acc);padding-left:11px;}
.sbtn{margin-top:6px;padding:14px;background:var(--acc);color:#fff;border:none;border-radius:11px;font-size:15px;font-family:var(--sans);font-weight:500;cursor:pointer;}

.spread{
  position:absolute;inset:0;overflow:hidden;
  display:flex;
}
.page-col{
  flex:1;overflow:hidden;
  padding:52px 44px;
  font-family:"BookkMyungjo",serif;
  position:relative;
}
.page-col+.page-col{
  border-left:1px solid var(--rdsep,rgba(92,74,50,.2));
}
/* 단면 모드(세로): .spread 에 .single 클래스 추가시 한 컬럼만 */
.spread.single .page-col:last-child{ display:none; }
.page-col p,.page-col .calibre1,.page-col .softbreak,.page-col .whitespace{
  font-size:16px;line-height:2;color:var(--rdtx,#3b2f1e);
  word-break:break-all;text-indent:1em;
  text-align:justify;text-justify:inter-character;
  margin:0;
}
.page-col .scenebreak{
  font-size:16px;line-height:2;color:var(--rdtx,#3b2f1e);
  text-align:center;text-indent:0;margin:0;opacity:.5;
}
.anno-ul{border-bottom:2px solid #4a7ef5;cursor:pointer;}
.anno-hl{background:#fde68a;border-radius:2px;cursor:pointer;}
.tap-prev,.tap-next{position:absolute;top:0;bottom:0;width:20%;z-index:10;cursor:pointer;}
.tap-prev{left:0;}.tap-next{right:0;}

.rbot{height:42px;display:flex;align-items:center;justify-content:center;gap:12px;border-top:1px solid var(--bdr);flex-shrink:0;}
.page-info{font-size:13px;color:var(--tx2);min-width:60px;text-align:center;}
.nav-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--bdr);background:transparent;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.nav-btn:active{background:var(--tag);}
.nav-btn:disabled{opacity:.3;cursor:default;}

.amenu{position:fixed;background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:5px;display:flex;gap:3px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.15);}
.amenu.off{display:none;}
.abtn{padding:7px 13px;border:none;border-radius:7px;font-size:13px;font-family:var(--sans);cursor:pointer;font-weight:500;}
.abtn.ul{background:#e8f0fe;color:#1a56db;}
.abtn.hl{background:#fef3c7;color:#92400e;}
.abtn.rm{background:var(--tag);color:var(--tx2);}
</style>
</head>
<body>

<div id="scr-login" class="screen">
  <div class="lbox">
    <h2>단편소설 읽기</h2>
    <p>학번과 이름을 입력하면<br>나만의 독서 기록이 저장돼요.</p>
    <div class="lg"><label>학번</label>
      <input type="number" id="inp-id" placeholder="2101" inputmode="numeric"></div>
    <div class="lg"><label>이름</label>
      <input type="text" id="inp-name"></div>
    <button class="lbtn" id="btn-login">시작하기</button>
    <div class="lnote">입력한 정보는 이 기기에만 저장돼요</div>
  </div>
</div>

<div id="scr-list" class="screen off">
  <div class="lhdr">
    <div><h1>단편소설 읽기</h1><p>모둠에서 한 작품을 골라 함께 읽어보세요.</p></div>
    <div class="hright">
      <div class="ubadge" id="ubadge"></div>
      <button class="tbtn" id="btn-theme">☀</button>
    </div>
  </div>
  <div class="lscroll"><div class="cgrid" id="cgrid"></div></div>
</div>

<div id="scr-reader" class="screen off">
  <div class="rtop" id="rtop">
    <div class="backbtn" id="btn-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>목록
    </div>
    <div class="rtitle" id="rtitle"></div>
    <div class="rctrls">
      <button class="cbtn on" id="btn-white">白</button>
      <button class="cbtn" id="btn-sepia">米</button>
      <button class="cbtn" id="btn-dark">夜</button>
    </div>
  </div>
  <div class="parea" id="parea">
    <div class="intro" id="intro">
      <div class="icwrap"><img class="icov" id="icov" alt="표지"></div>
      <div class="ititle" id="ititle"></div>
      <div class="iauthor" id="iauthor"></div>
      <div class="ntags" id="itags"></div>
      <div class="idesc" id="idesc"></div>
      <div class="ioneliner" id="ioneliner"></div>
      <button class="sbtn" id="btn-start">소설 읽기 시작 →</button>
    </div>
    <div id="spread" class="spread">
      <div id="page-left"  class="page-col"></div>
      <div id="page-right" class="page-col"></div>
    </div>
    <div class="tap-prev" id="tap-prev"></div>
    <div class="tap-next" id="tap-next"></div>
  </div>
  <div class="rbot" id="rbot">
    <button class="nav-btn" id="btn-prev">‹</button>
    <div class="page-info" id="page-info">— / —</div>
    <button class="nav-btn" id="btn-next">›</button>
  </div>
</div>

<div class="amenu off" id="amenu">
  <button class="abtn ul" id="abtn-ul">밑줄</button>
  <button class="abtn hl" id="abtn-hl">형광펜</button>
  <button class="abtn rm" id="abtn-rm" style="display:none">지우기</button>
</div>

function doLogin(){
  const id=document.getElementById('inp-id').value.trim();
  const nm=document.getElementById('inp-name').value.trim();
  if(!/^\d{4}$/.test(id)){alert('학번 4자리를 입력해 주세요.');return;}
  if(!nm){alert('이름을 입력해 주세요.');return;}
  user=id+'_'+nm;
  document.getElementById('ubadge').textContent=id+' '+nm;
  document.getElementById('scr-login').classList.add('off');
  document.getElementById('scr-list').classList.remove('off');
  buildCards();
}

// ── CARDS ──
function buildCards(){
  const grid=document.getElementById('cgrid');
  grid.innerHTML='';
  NOVELS.forEach(n=>{
    const card=document.createElement('div');
    card.className='ncard';
    const k=String(n.id).padStart(2,'0');
    const pg=user?loadPg(n.id):0;
    if(COVERS[k]){
      const img=document.createElement('img');
      img.className='ncov';img.src=COVERS[k];img.alt=n.title;
      img.onerror=function(){this.outerHTML=`<div class="ncov-fb"><span>${n.title}</span><small>${n.author}</small></div>`;}
      card.appendChild(img);
    }else{
      card.innerHTML+=`<div class="ncov-fb"><span>${n.title}</span><small>${n.author}</small></div>`;
    }
    const body=document.createElement('div');body.className='nbody';
    body.innerHTML=`
      <div class="nnum">${String(n.id).padStart(2,'0')}${pg>0?` <span style="color:var(--acc);font-weight:500">${pg+1}p</span>`:''}</div>
      <div class="ntitle">${n.title}</div>
      <div class="nauthor">${n.author}</div>
      <div class="ntags">${n.tags.map(t=>`<span class="ntag">${t}</span>`).join('')}</div>
      <div class="noneliner">${n.oneliner}</div>`;
    card.appendChild(body);
    card.onclick=()=>openNovel(n);
    grid.appendChild(card);
  });
}

// ── LinePaginator: 줄 단위 JS 페이지네이션 ──
class LinePaginator {
  constructor(el){
    this.el=el;
    this.pages=[];
    this.cur=0;
    this.total=0;
    this.LH=36;
    this.linesPerPage=0;
    this.blocks=[];
    this.halfLeading=0;
  }

  paginate(html){
    const cs=getComputedStyle(this.el);
    const padT=parseFloat(cs.paddingTop)||0;
    const padB=parseFloat(cs.paddingBottom)||0;
    const padL=parseFloat(cs.paddingLeft)||0;
    const padR=parseFloat(cs.paddingRight)||0;
    const innerW=this.el.clientWidth-padL-padR;
    const availH=this.el.clientHeight-padT-padB;

    const probe=document.createElement('div');
    probe.style.cssText=
      'position:fixed;visibility:hidden;pointer-events:none;'+
      'top:0;left:-9999px;'+
      'width:'+innerW+'px;'+
      'font-family:"BookkMyungjo",serif;font-size:16px;line-height:2;'+
      'word-break:break-all;text-indent:1em;'+
      'text-align:justify;text-justify:inter-character;'+
      'margin:0;padding:0;box-sizing:border-box;';
    document.body.appendChild(probe);

    probe.innerHTML='<p style="margin:0;padding:0">가나다라마바사아자차카타파하가나다라마바사아자차카타파하가나다라마바사아자차카타파하가나다</p>';
    const LH=this._measureLH(probe.firstElementChild, probe);
    this.LH=LH;
    const lpp=Math.max(1, Math.floor(availH/LH));
    this.linesPerPage=lpp;

    const tmp=document.createElement('div');
    tmp.innerHTML=html||'<p></p>';
    let paras=Array.from(tmp.children);
    if(!paras.length){const p=document.createElement('p');p.innerHTML=tmp.innerHTML;paras=[p];}

    this.blocks=[];
    for(const para of paras){
      probe.innerHTML=para.outerHTML;
      const el=probe.firstElementChild;
      if(!el) continue;
      const lc=this._countLines(el,probe);
      if(lc>0) this.blocks.push({html:para.outerHTML, lc});
    }
    document.body.removeChild(probe);

    // 페이지 시작점만 기록: {blkIdx, skipLines}
    // blkIdx 단락의 skipLines번째 줄부터 이 페이지 시작
    this.pages=[];
    let bi=0, sl=0;
    while(bi<this.blocks.length){
      this.pages.push({bi, sl});
      let filled=0;
      while(bi<this.blocks.length && filled<lpp){
        const rem=this.blocks[bi].lc - sl;
        const take=Math.min(rem, lpp-filled);
        filled+=take;
        sl+=take;
        if(sl>=this.blocks[bi].lc){ bi++; sl=0; }
      }
    }

    this.total=this.pages.length;
    this.cur=0;
    return this.total;
  }

  render(idx){
    this.cur=Math.max(0,Math.min(idx,this.total-1));
    const {bi:startBi, sl:startSl}=this.pages[this.cur];
    const LH=this.LH, lpp=this.linesPerPage;
    let html='', filled=0, bi=startBi, sl=startSl;

    while(bi<this.blocks.length && filled<lpp){
      const blk=this.blocks[bi];
      const rem=blk.lc - sl;
      const take=Math.min(rem, lpp-filled);

      if(sl===0 && take===blk.lc){
        // 단락 전체를 그대로 표시
        html+=blk.html;
      } else {
        // 단락 일부만 표시
        // sl>0: 앞 sl줄 숨기기  →  position:relative 컨테이너 안에서
        //       단락을 -sl*LH만큼 위로 올리고, 컨테이너 높이는 take*LH
        //       컨테이너는 overflow:hidden
        // halfLeading 보정
        // - 위: top:-skipPx 시 첫 줄 half-leading만큼 덜 올려짐 → skipPx에서 halfLeading 뺌
        // - 아래: 마지막 줄 아래 half-leading이 잘림 → showPx에 halfLeading 더함
        const halfL=this.halfLeading||0;
        const skipPx = Math.round(sl * LH - halfL);
        const showPx = Math.round(take * LH + halfL);
        html +=
          '<div style="position:relative;height:'+showPx+'px;overflow:hidden;">'+
            '<div style="position:absolute;top:-'+skipPx+'px;left:0;right:0;">'+
              blk.html+
            '</div>'+
          '</div>';
      }

      filled+=take;
      sl+=take;
      if(sl>=blk.lc){ bi++; sl=0; }
    }
    return html;
  }

  _measureLH(el,probe){
    try{
      const range=document.createRange();
      range.selectNodeContents(el);
      const rects=[...range.getClientRects()];
      const base=probe.getBoundingClientRect().top;
      const topVals=[...rects].map(r=>r.top-base);
      const uniq=[...new Set(topVals.map(v=>Math.round(v)))].sort((a,b)=>a-b);
      if(uniq.length>=2){
        const t0=topVals.filter(v=>Math.round(v)===uniq[0]);
        const t1=topVals.filter(v=>Math.round(v)===uniq[1]);
        const avg0=t0.reduce((a,b)=>a+b,0)/t0.length;
        const avg1=t1.reduce((a,b)=>a+b,0)/t1.length;
        // avg0 = 첫 줄 top = half-leading
        this.halfLeading=avg0;
        return avg1-avg0;
      }
      if(rects.length){ this.halfLeading=0; return rects[0].height; }
    }catch(e){}
    this.halfLeading=0; return 32;
  }

  _countLines(el,probe){
    try{
      const range=document.createRange();
      range.selectNodeContents(el);
      const rects=[...range.getClientRects()];
      const base=probe.getBoundingClientRect().top;
      const seen=new Set();
      for(const r of rects) seen.add(Math.round(r.top-base));
      if(seen.size>0) return seen.size; // 줄 수는 정수
    }catch(e){}
    return Math.max(1,Math.round(el.getBoundingClientRect().height/this.LH));
  }
}


function initFrame(){
  if(!novel) return;
  const pv=document.getElementById('spread').parentElement;
  document.getElementById('page-left').innerHTML='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#aaa">페이지 계산 중…</div>';
  document.getElementById('page-right').innerHTML='';

  // 폰트 로드 완전히 끝난 후 측정
  document.fonts.ready.then(()=>requestAnimationFrame(()=>{
    const content=novel.body||'<p style="text-align:center;margin-top:3em;color:#aaa">본문이 준비 중이에요.</p>';
    // 가로(양면) / 세로(단면) 모드 결정
    const spread=document.getElementById('spread');
    const isLandscape=pv.clientWidth>pv.clientHeight;
    spread.classList.toggle('single', !isLandscape);
    // 측정은 한 컬럼 기준
    const col=document.getElementById('page-left');
    paginator=new LinePaginator(col);
    const total=paginator.paginate(content);
    const startPg=user?loadPg(novel.id):0;
    gotoPage(Math.min(startPg, total-1));
  }));
}


function gotoPage(p){
  if(!paginator) return;
  const spread=document.getElementById('spread');
  const single=spread.classList.contains('single');
  const left =document.getElementById('page-left');
  const right=document.getElementById('page-right');

  // 양면: 왼쪽은 항상 짝수 index (0,2,4...)
  const base=single ? p : (p%2===0 ? p : p-1);
  const cur=Math.max(0, Math.min(base, paginator.total-1));
  paginator.cur=cur;

  left.innerHTML=paginator.render(cur);
  if(!single){
    const rIdx=cur+1;
    right.innerHTML=rIdx<paginator.total ? paginator.render(rIdx) : '';
  }

  const total=paginator.total;
  // 페이지 번호: index+1 (1-based)
  // 왼쪽=cur+1, 오른쪽=cur+2
  if(single){
    document.getElementById('page-info').textContent=(cur+1)+' / '+total;
  } else {
    const hasRight=cur+1<total;
    document.getElementById('page-info').textContent=
      hasRight ? (cur+1)+'-'+(cur+2)+' / '+total
               : (cur+1)+' / '+total;
  }
  document.getElementById('btn-prev').disabled=cur<=0;
  document.getElementById('btn-next').disabled=
    single ? cur>=total-1 : cur+2>=total;
  if(user&&novel) savePg(novel.id,cur);
}


function isSingle(){ return document.getElementById('spread').classList.contains('single'); }
function nextPage(){
  if(!paginator) return;
  const step=isSingle()?1:2;
  const next=paginator.cur+step;
  if(next<paginator.total) gotoPage(next);
}
function prevPage(){
  if(!paginator) return;
  const step=isSingle()?1:2;
  const prev=paginator.cur-step;
  if(prev>=0) gotoPage(prev);
}
document.getElementById('btn-next').onclick=nextPage;
document.getElementById('btn-prev').onclick=prevPage;
document.getElementById('tap-next').onclick=nextPage;
document.getElementById('tap-prev').onclick=prevPage;

document.getElementById('btn-start').onclick=()=>{
  document.getElementById('intro').classList.add('off');
  loadAndInit();
};

// txt 폴더에서 본문 로드 후 initFrame 호출
function loadAndInit(){
  if(!novel) return;
  const left=document.getElementById('page-left');
  left.innerHTML='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#aaa">본문 불러오는 중…</div>';
  document.getElementById('page-right').innerHTML='';

  const pad=String(novel.id).padStart(2,'0');
  fetch('txt/'+pad+'.txt')
    .then(r=>{
      if(!r.ok) throw new Error(r.status);
      return r.text();
    })
    .then(txt=>{
      novel.body=txtToHtml(txt);
      initFrame();
    })
    .catch(()=>{
      novel.body='<p style="text-align:center;margin-top:3em;color:#aaa">본문을 불러올 수 없어요.</p>';
      initFrame();
    });
}

// txt → <p> HTML 변환
function txtToHtml(txt){
  const lines=txt.replace(/\r/g,'').split('\n');
  return lines.map(l=>{
    const t=l.trim();
    if(!t) return '<p class="softbreak"> </p>';
    if(t==='*') return '<p class="scenebreak">*</p>';
    const esc=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return '<p class="calibre1">'+esc+'</p>';
  }).join('\n');
}

document.getElementById('btn-back').onclick=()=>{
  document.getElementById('scr-reader').classList.add('off');
  document.getElementById('scr-list').classList.remove('off');
  document.getElementById('page-left').innerHTML='';
  document.getElementById('page-right').innerHTML='';
  novel=null; paginator=null;
  buildCards(); hideAmenu();
};

window.addEventListener('resize',()=>{

  },300);
});


// ── ANNO MENU ──
let annoTarget=null;
const amenu=document.getElementById('amenu');
function hideAmenu(){amenu.classList.add('off');annoTarget=null;}
function showAmenu(x,y){
  document.getElementById('abtn-rm').style.display='none';
  annoTarget=null;
  amenu.style.left=Math.min(x-70,window.innerWidth-160)+'px';
  amenu.style.top=Math.max(y-52,4)+'px';
  amenu.classList.remove('off');
}
function showAmenuWithTarget(x,y,id){
  document.getElementById('abtn-rm').style.display='';
  annoTarget=id;
  amenu.style.left=Math.min(x-70,window.innerWidth-160)+'px';
  amenu.style.top=Math.max(y-52,4)+'px';
  amenu.classList.remove('off');
}
(()=>{
  const btn=document.getElementById('abtn-ul');
  const fn=(e)=>{e.preventDefault();e.stopPropagation();applyAnno('ul');hideAmenu();};
  btn.addEventListener('touchstart',fn,{passive:false});
  btn.addEventListener('click',fn);
})();
(()=>{
  const btn=document.getElementById('abtn-hl');
  const fn=(e)=>{e.preventDefault();e.stopPropagation();applyAnno('hl');hideAmenu();};
  btn.addEventListener('touchstart',fn,{passive:false});
  btn.addEventListener('click',fn);
})();
(()=>{
  const btn=document.getElementById('abtn-rm');
  const fn=(e)=>{
    e.preventDefault(); e.stopPropagation();
    if(!annoTarget){hideAmenu();return;}
    const left=document.getElementById('page-left');
    const right=document.getElementById('page-right');
    const sp=left.querySelector('[data-aid="'+annoTarget+'"]')||
              right.querySelector('[data-aid="'+annoTarget+'"]');
    if(sp){const p=sp.parentNode;while(sp.firstChild)p.insertBefore(sp.firstChild,sp);p.removeChild(sp);}
    const annos=loadAnnos();
    if(annos[novel.id]){annos[novel.id]=annos[novel.id].filter(a=>a.id!==annoTarget);saveAnnos(annos);}
    hideAmenu();
  };
  btn.addEventListener('touchstart',fn,{passive:false});
  btn.addEventListener('click',fn);
})();
// 주석 적용 (페이지 뷰 직접 조작)

function onSel(){
  setTimeout(()=>{
    const sel=window.getSelection();
    if(sel&&!sel.isCollapsed&&sel.toString().trim()){
      savedRange=sel.getRangeAt(0).cloneRange();
      const r=savedRange.getBoundingClientRect();
      showAmenu(r.left+r.width/2, r.top);
    }
  },60);
}
document.getElementById('page-left').addEventListener('mouseup',onSel);
document.getElementById('page-right').addEventListener('mouseup',onSel);
document.getElementById('page-left').addEventListener('touchend',onSel);
document.getElementById('page-right').addEventListener('touchend',onSel);

// 주석 직접 적용
function applyAnno(annoType){
  const left=document.getElementById('page-left');
  const right=document.getElementById('page-right');
  // 터치 환경: savedRange 우선 사용 (touchend 후 sel이 사라질 수 있음)
  let range=savedRange;
  if(!range){
    const sel=window.getSelection();
    if(!sel||sel.isCollapsed) return;
    range=sel.getRangeAt(0);
  }
  savedRange=null;
  try{
    const inPage=left.contains(range.commonAncestorContainer)||
                 right.contains(range.commonAncestorContainer);
    if(!inPage) return;
    const sp=document.createElement('span');
    sp.className=annoType==='ul'?'anno-ul':'anno-hl';
    const id=Date.now().toString();
    sp.dataset.aid=id;
    range.surroundContents(sp);
    sp.onclick=e=>{e.stopPropagation();showAmenuWithTarget(e.clientX,e.clientY,id);};
    const annos=loadAnnos();
    if(!annos[novel.id]) annos[novel.id]=[];
    annos[novel.id].push({id,text:sp.textContent,type:annoType});
    saveAnnos(annos);
  }catch(e){}
  sel.removeAllRanges();
}
